{% load static %}

<!DOCTYPE html>

<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulaire d'inscription interactif</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../static/style.css">
</head>
<body>
    <div class="container">
        <h1>Formulaire d'inscription</h1>
        <form id="inscriptionForm">
            <div class="form-group">
                <div class="input-wrapper">
                    <input type="text" id="nom" name="nom" required placeholder=" ">
                    <label for="nom">Nom :</label>
                </div>
                <span class="error-message"></span>
   https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap         </div>

            <div class="form-group">
                <div class="input-wrapper">
                    <input type="text" id="prenom" name="prenom" required placeholder=" ">
                    <label for="prenom">Prénom :</label>
                </div>
                <span class="error-message"></span>
            </div>

            <div class="form-group">
                <div class="input-wrapper">
                    <input type="email" id="email" name="email" required placeholder=" ">
                    <label for="email">Email :</label>
                </div>
                <span class="error-message"></span>
            </div>

            <div class="form-group">
                <div class="input-wrapper">
                    <input type="tel" id="telephone" name="telephone" placeholder=" ">
                    <label for="telephone">Numéro de téléphone :</label>
                </div>
                <span class="error-message"></span>
            </div>

            <div class="form-group">
                <div class="input-wrapper">
                    <input type="date" id="date_naissance" name="date_naissance" placeholder=" ">
                    <label for="date_naissance">Date de naissance :</label>
                </div>
                <span class="error-message"></span>
            </div>

            <div class="form-group">
                <label>Sexe :</label>
                <div class="radio-group">
                    <input type="radio" id="sexe_homme" name="sexe" value="homme">
                    <label for="sexe_homme">Homme</label>
                    <input type="radio" id="sexe_femme" name="sexe" value="femme">
                    <label for="sexe_femme">Femme</label>
                    
                </div>
                <span class="error-message error-message-radio"></span>
            </div>

            <div class="form-group">
                <div class="input-wrapper">
                    <input type="text" id="nationalite" name="nationalite" placeholder=" ">
                    <label for="nationalite">Nationalité/Nationality :</label>
                </div>
                <span class="error-message"></span>
            </div>

            <div class="form-group">
                <label for="date_creation">Date de création :</label>
                <input type="date" id="date_creation" name="date_creation" readonly>
            </div>

            <div class="form-group">
                <label for="photo">Insertion photo (max 2MB) :</label>
                <input type="file" id="photo" name="photo" accept="image/*">
                <div id="photo-preview-container">
                    <img id="photo-preview" src="#" alt="Aperçu photo" style="display:none;"/>
                </div>
                <span class="error-message"></span>
            </div>

            <div class="form-group">
                <label for="piece_afferente">Pièce afférente (max 5MB) :</label>
                <input type="file" id="piece_afferente" name="piece_afferente" accept=".pdf,.doc,.docx,.jpg,.png">
                <span class="error-message"></span>
            </div>
            
            <div id="form-message" class="form-message-area"></div>

            <button type="submit" class="submit-btn">Soumettre</button>
        </form>
    </div>
    <script src="script.js"></script>
</body>
</html>
